apiVersion: 1

# Loads every dashboard JSON in this folder on startup. Edit the JSON in the
# repo, not in the UI: UI changes are lost on the next deploy.
providers:
  - name: my-time
    folder: my-time
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
