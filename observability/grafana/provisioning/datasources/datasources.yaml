apiVersion: 1

# Older deploys provisioned "Loki" without a uid. Deleting it first lets it be
# recreated with the fixed uid that dashboards and alert rules reference;
# provisioning runs this on every start, which is harmless.
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      prometheusType: Prometheus
      # Matches Alloy's scrape interval, so $__rate_interval covers 4 samples.
      timeInterval: 30s
