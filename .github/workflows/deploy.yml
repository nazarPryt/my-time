name: Deploy

# Fires only after the CI workflow finishes running on main — guarantees the
# commit being deployed already passed every required check (guide §1: CI
# and CD are separate pipelines, CD only ever ships code that already passed CI).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # ghcr.io requires lowercase image names — github.repository_owner is
  # "nazarPryt" (mixed case) and would break the push, so this is hardcoded
  # rather than interpolated.
  API_IMAGE: ghcr.io/nazarpryt/my-time-api
  WEB_IMAGE: ghcr.io/nazarpryt/my-time-web

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      sha_tag: sha-${{ steps.sha.outputs.short }}
    steps:
      - name: Resolve short SHA
        id: sha
        run: echo "short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          # Build the exact commit CI validated, not whatever main has moved
          # to since (guide §5: deploy what passed CI, nothing else).
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    # STUBBED — flip this on once VPS SSH access exists. Two prerequisites
    # beyond adding secrets:
    #   1. docker-compose.prod.yml's `api`/`web` services currently `build:`
    #      from source on the server. Switch them to
    #      `image: ghcr.io/nazarpryt/my-time-{api,web}:${IMAGE_TAG:-latest}`
    #      so `pull` + `up --no-build` below actually has something to pull —
    #      left as-is for now so local `bun run docker:build`/`docker:up`
    #      (which build from source) keep working unchanged.
    #   2. /opt/my-time below is a placeholder for wherever docker-compose.prod.yml
    #      actually lives on the VPS — confirm and adjust.
    # Then: add SSH_HOST, SSH_USER, SSH_PRIVATE_KEY as secrets on the
    # "production" GitHub Environment, and delete the `if: false` line.
    # See docs/cicd-professional-guide.md §10 for the full checklist.
    if: false
    env:
      DEPLOY_DIR: /opt/my-time
      NEW_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
    steps:
      - name: Run pending migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NEW_TAG,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            IMAGE_TAG="$NEW_TAG" docker compose -f docker-compose.prod.yml pull api
            IMAGE_TAG="$NEW_TAG" docker compose -f docker-compose.prod.yml run --rm \
              api bun --filter api db:migrate

      - name: Roll containers to the new images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NEW_TAG,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            # Remember what was running before the swap, so a failed health
            # check below can redeploy it verbatim (guide §7: rollback = the
            # previous SHA tag, no rebuild).
            [ -f .deployed-tag ] && cp .deployed-tag .deployed-tag.prev || true
            IMAGE_TAG="$NEW_TAG" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$NEW_TAG" docker compose -f docker-compose.prod.yml up -d --no-build
            echo "$NEW_TAG" > .deployed-tag

      - name: Health check with retry, rollback on failure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # api only `expose`s 3000 to other containers on the compose
            # network (docker-compose.prod.yml), not to the host, and the
            # oven/bun:alpine image has no curl/wget — check from inside the
            # container using bun's own fetch instead.
            healthy=false
            for _ in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T api \
                bun -e "process.exit((await fetch('http://localhost:3000/api/v1/health')).ok ? 0 : 1)"; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" = true ]; then
              echo "Deploy healthy."
              rm -f .deployed-tag.prev
              exit 0
            fi

            if [ ! -f .deployed-tag.prev ]; then
              echo "Health check failed and there's no previous tag on record — manual rollback needed." >&2
              exit 1
            fi

            echo "Health check failed — rolling back to previous image." >&2
            PREV_TAG="$(cat .deployed-tag.prev)"
            IMAGE_TAG="$PREV_TAG" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="$PREV_TAG" docker compose -f docker-compose.prod.yml up -d --no-build
            echo "$PREV_TAG" > .deployed-tag
            exit 1
