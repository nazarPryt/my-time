name: Release

# After CI passes on a push to main, tag the commit with the version from
# package.json and publish a GitHub Release with its notes. A push that
# didn't bump the version finds the tag already there and does nothing.
# Then fast-forward dev to main so it gets the PR's merge commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag, GitHub Release & dev sync
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(jq -r .version package.json)"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to release."
            exit 0
          fi
          bun scripts/release/print-notes.ts "$VERSION" > release-notes.md
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file release-notes.md
      # A plain push only fast-forwards, so new commits on dev are never overwritten.
      - name: Sync dev with main
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git push origin "$SHA:refs/heads/dev"; then
            echo "dev is now at $SHA."
          else
            echo "::warning::dev has commits main doesn't, so it wasn't fast-forwarded. Merge main into dev by hand."
          fi
