x-logging: &default-logging
  driver: json-file
  options:
    # Docker's own on-disk log file is capped here; Alloy ships the full
    # history into Loki (see the loki service), which has its own retention.
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Slow statements, lock waits and checkpoints land in Loki ({service="db"}).
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3000"
      # Prometheus metrics for Alloy; never routed publicly.
      - "9464"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      API_URL: ${API_URL}
      HOST: 0.0.0.0
      PORT: 3000
      FRONTEND_WEB_URL: ${FRONTEND_WEB_URL}
      PERMESSO_WEBSITE_URL: ${PERMESSO_WEBSITE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_PORT: 9464
    volumes:
      # Permesso error screenshots survive redeploys. A new named volume is
      # seeded from the image's /app/screenshots, so it keeps the bun owner.
      - permesso-screenshots:/app/screenshots
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Startup runs migrations and syncs quiz content first.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        # Baked into the extension zip the web image builds and serves.
        FRONTEND_WEB_URL: ${FRONTEND_WEB_URL}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - api

  # English quiz micro frontend. Not exposed publicly: web's nginx proxies
  # /remotes/english-quiz/ to it, so it shares the site's origin. web does
  # not depend_on it on purpose — the site must work while it is down.
  english-quiz:
    build:
      context: .
      dockerfile: apps/english-quiz/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # --- Observability stack (docs/observability.md): Alloy collects logs
  # and metrics, Loki and Prometheus store them, Grafana shows dashboards and
  # sends alerts to Telegram. All free/self-hosted; configs in observability/.
  # Only Grafana is meant to be routed publicly. Memory limits keep it all
  # inside a small VPS; GOMEMLIMIT makes the Go services GC before hitting them. ---

  # Configs are COPYed in at build time (rather than bind-mounted from the
  # host) — a bind-mount source that isn't present exactly where the deploy
  # tool expects gets silently auto-created by Docker as an empty directory,
  # which then fails to mount onto the file it's supposed to replace. Baking
  # the config into the image sidesteps that entirely, using the same build
  # mechanism as the api/web services.
  loki:
    build:
      context: ./observability
      dockerfile: loki.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    expose:
      - "3100"
    environment:
      GOMEMLIMIT: 400MiB
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      # The ingester reports not-ready for ~15s after boot.
      start_period: 30s

  prometheus:
    build:
      context: ./observability
      dockerfile: prometheus.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Prometheus 3 derives GOMEMLIMIT from this limit by itself.
    mem_limit: 512m
    expose:
      - "9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # Whichever limit is hit first wins, so a metric explosion can't fill the disk.
      - --storage.tsdb.retention.size=5GB
      # Alloy pushes every sample here; Prometheus scrapes nothing itself.
      - --web.enable-remote-write-receiver
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 3s
      retries: 3

  alloy:
    build:
      context: ./observability
      dockerfile: alloy.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    # cAdvisor needs the host cgroup tree and PIDs (for per-container network
    # stats) to see the other containers.
    cgroup: host
    pid: host
    environment:
      GOMEMLIMIT: 400MiB
      # Probed from outside like a user would (blackbox exporter).
      API_URL: ${API_URL}
      FRONTEND_WEB_URL: ${FRONTEND_WEB_URL}
      POSTGRES_EXPORTER_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      GRAFANA_METRICS_PASSWORD: ${GRAFANA_METRICS_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor reads container metadata through containerd.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # Host CPU/memory/disk for the node exporter.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # Read positions per container, so a restart doesn't resend old logs;
      # also holds the remote_write WAL so a Prometheus restart loses nothing.
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # No healthcheck: the image has no wget/curl. "Alloy down" alerts instead.
    depends_on:
      - loki
      - prometheus

  grafana:
    build:
      context: ./observability
      dockerfile: grafana.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Links in alert messages point here.
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-localhost}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # /metrics is public through the Grafana domain; basic auth applies
      # only when the password is set (Alloy sends the same credentials).
      GF_METRICS_BASIC_AUTH_USERNAME: metrics
      GF_METRICS_BASIC_AUTH_PASSWORD: ${GRAFANA_METRICS_PASSWORD:-}
      # Optional until set: grafana-entrypoint.sh keeps Grafana bootable without them.
      GRAFANA_ALERT_TELEGRAM_BOT_TOKEN: ${GRAFANA_ALERT_TELEGRAM_BOT_TOKEN:-}
      GRAFANA_ALERT_TELEGRAM_CHAT_ID: ${GRAFANA_ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      - loki
      - prometheus

volumes:
  db-data:
  permesso-screenshots:
  loki-data:
  prometheus-data:
  grafana-data:
  alloy-data:
