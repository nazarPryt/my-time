x-logging: &default-logging
  driver: json-file
  options:
    # Docker's own on-disk log file is capped here; Promtail ships the full
    # history into Loki (see the loki service), which has its own retention.
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      API_URL: ${API_URL}
      HOST: 0.0.0.0
      PORT: 3000
      FRONTEND_WEB_URL: ${FRONTEND_WEB_URL}
      PERMESSO_WEBSITE_URL: ${PERMESSO_WEBSITE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    depends_on:
      - api

  # --- Observability stack: Loki stores logs, Promtail ships them from every
  # container's Docker logs, Grafana is where you actually read them. All
  # free/self-hosted — see observability/ for their configs. ---

  # loki/promtail/grafana configs are COPYed in at build time (rather than
  # bind-mounted from the host) — a bind-mount source that isn't present
  # exactly where the deploy tool expects gets silently auto-created by
  # Docker as an empty directory, which then fails to mount onto the file
  # it's supposed to replace. Baking the config into the image sidesteps
  # that entirely, using the same build mechanism as the api/web services.
  loki:
    build:
      context: ./observability
      dockerfile: loki.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    build:
      context: ./observability
      dockerfile: promtail.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    build:
      context: ./observability
      dockerfile: grafana.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  db-data:
  loki-data:
  grafana-data:
