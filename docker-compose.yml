# Fixed project name: Compose otherwise derives it from the folder name, so a
# git worktree would become a different project and collide with the main
# checkout's fixed container names (DB, API, WEB). With this, every checkout
# shares the same containers and the same DB_DATA_PATH data.
name: my-time

services:
  db:
    image: postgres:17-alpine
    container_name: DB
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "5432:5432"
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: API
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/my_time
      API_URL: http://localhost:3000
      FRONTEND_WEB_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: WEB
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  # Micro frontend, reached through web's nginx at /remotes/english-quiz/.
  english-quiz:
    build:
      context: .
      dockerfile: apps/english-quiz/Dockerfile
    container_name: ENGLISH_QUIZ
    restart: unless-stopped
