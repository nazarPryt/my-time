# JSON access log, one line per request, shipped to Loki by Alloy. The path is
# logged without its query string so tokens in URLs never reach the logs.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

log_format json_access escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_path",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"user_agent":"$http_user_agent","referer":"$http_referer"}';

server {
    listen 80;
    access_log /dev/stdout json_access;

    # Container healthcheck; kept out of the access log so it isn't noise in Loki.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving the remote per request (via the
    # variable below) instead of at startup means nginx still boots when a
    # remote container is down or not deployed yet — the host then shows the
    # remote's error state instead of the whole site failing.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Micro frontends: same-origin path → the remote's own container.
    location /remotes/english-quiz/ {
        set $english_quiz_upstream http://english-quiz:80;
        proxy_pass $english_quiz_upstream;
        proxy_set_header Host $host;
    }

    # Vite content-hashes these names, so a deploy never reuses one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and other stable names must be revalidated, or users keep
    # the previous release after a deploy.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
