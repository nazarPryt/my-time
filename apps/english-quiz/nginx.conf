# JSON access log, one line per request, shipped to Loki by Alloy. The path is
# logged without its query string so tokens in URLs never reach the logs.
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}

log_format json_access escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_path",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"user_agent":"$http_user_agent","referer":"$http_referer"}';

server {
    listen 80;
    access_log /dev/stdout json_access;

    # Container healthcheck; kept out of the access log so it isn't noise in Loki.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;

    # Entry points have stable names, so browsers must revalidate them on
    # every load — otherwise users keep running an old remote after a deploy.
    location ~ ^/remotes/english-quiz/(mf-manifest\.json|remoteEntry\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else is content-hashed by Vite: cache it forever. A new
    # deploy produces new file names, referenced by the new manifest.
    location /remotes/english-quiz/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /remotes/english-quiz/ {
        try_files $uri =404;
    }
}
